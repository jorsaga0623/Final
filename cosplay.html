<head>

    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body id="top">

  <!-- Navigation -->
  <header class="nav cosplay-nav">

    <a class="logo" href="index.html">JORSAGA PHOTO</a>

    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false"
      aria-controls="mobile-navigation">
      ☰
    </button>

    <div class="mobile-navigation" id="mobile-navigation">

      <nav class="nav-left">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>

        <div class="nav-dropdown">
          <a href="portfolio.html" class="nav-dropdown-link">
            Portfolio <span class="dropdown-arrow">⌄</span>
          </a>

          <div class="dropdown-menu">
            <a href="cosplay.html">Cosplay</a>
            <a href="chinese-culture.html">Chinese Culture</a>
            <a href="portrait.html">Portrait</a>
            <a href="vintage.html">Vintage</a>
          </div>
        </div>
      </nav>

      <nav class="nav-right">
        <a href="investment.html">Investment</a>
        <a href="experiment.html">Experiment</a>
        <a href="contact.html">Contact</a>
      </nav>

    </div>

  </header>

  <!-- Cosplay Hero -->
  <section class="hero cosplay-hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1>COSPLAY</h1>
      <p>Step into another world.</p>
    </div>
  </section>

  <!-- Cosplay Slideshow -->
  <main class="cosplay-page">

    <section class="cosplay-slideshow" aria-label="Cosplay photography slideshow">

      <div class="slide-stage">
        <img id="cosplay-slide" src="images/cosplay-1.jpg" alt="Cosplay photography">
      </div>

    </section>

  </main>

  <!-- Footer -->

    <div class="footer-decoration">

    </div>

      <a href="#top">Back to Top</a>
      <a href="contact.html">Contact</a>
      <a href="#">FAQ</a>
    </div>

  </footer>

  <!-- Mobile Navigation Script -->
  <script>
    const menuButton = document.querySelector(".menu-toggle");
    const navigation = document.querySelector(".nav");

    if (menuButton && navigation) {
      menuButton.addEventListener("click", function () {
        const isOpen = navigation.classList.toggle("menu-open");

        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute(
          "aria-label",
          isOpen ? "Close navigation menu" : "Open navigation menu"
        );

        menuButton.textContent = isOpen ? "✕" : "☰";
      });
    }
  </script>

  <!-- Cosplay Slideshow Script -->
  <script>
    const cosplayImages = [
      "images/cosplay-1.jpg",
      "images/cosplay-2.jpg",
      "images/cosplay-3.jpg",
      "images/cosplay-4.jpg"
    ];

    const slide = document.getElementById("cosplay-slide");

    let currentSlide = 0;

    function showRandomSlide() {
      if (cosplayImages.length < 2) return;

      let nextIndex;

      do {
        nextIndex = Math.floor(Math.random() * cosplayImages.length);
      } while (nextIndex === currentSlide);

      currentSlide = nextIndex;
      slide.style.opacity = "0";

      setTimeout(() => {
        slide.onload = () => {
          slide.style.opacity = "1";
        };

        slide.onerror = () => {
          console.error("图片加载失败：", slide.src);
          slide.style.opacity = "1";
        };

        slide.src = cosplayImages[currentSlide];
      }, 500);
    }

    setInterval(showRandomSlide, 4000);
  </script>

</body>

</html>
